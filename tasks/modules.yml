- name: "create extra dir"
  file:
    path: "{{ fuseki_base }}/extra"
    state: "directory"
    owner: "fuseki"
  become: true

- name: "create .m2 dir"
  file:
   path: "/home/fuseki/.m2"
   state: "directory"
   owner: fuseki
  become: true

- name: "Download modules to $JENA_BASE/extra"
  get_url:
    url: "{{ item }}"
    dest: "{{ fuseki_base }}/extra"
  with_items: "{{ fuseki_modules }}"
  when: "fuseki_modules is defined and fuseki_modules | length > 0"
  become: true

- name: Find fuseki_extra_files in directory
  ansible.builtin.find:
    paths: "{{ fuseki_base }}/extra"
    file_type: file
    recurse: false
  register: fuseki_extra_files

- name: Show results
  ansible.builtin.debug:
    var: fuseki_extra_files.files

