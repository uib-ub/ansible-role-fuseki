---

- name: Converge
  hosts: all
  become_method: su
  tasks:
    - name: "update dnf"
      dnf:
        name: "*"
        state: "latest"
      become: true

    - name: "install required dependencies"
      package:
        name:  ["unzip","which", "java-21-openjdk", "java-21-openjdk-headless", "maven"]
      become: true

    - name: Correct java version selected
      community.general.alternatives:
        name: java
        link: /usr/bin/java
        path: "/usr/lib/jvm/jre-21/bin/java"
      become: true

    - name: "Include fuseki"
      import_role:
        name: "oyvindlgjesdal.fuseki"
      vars:
        fuseki_debug: true
        maven_repo: "https://repository.apache.org/content/repositories/orgapachejena-1071/"
        fuseki_version: "6.0.0"
        fuseki_checksum: "8b14dcefade409bb4efd94e05291ea46d50508bf175f6f163f328d1d80183559a4c5b75806802283802a2879405a132b9b311e2277f784a784fa66ce4a9d8722"
        jena_checksum: "c66b413f0c97e465c8a5a71f2718116134c65efa71205e136a42ad0ee6d39deece0dcbcc99801d806e4b60af5fe886c72eb53c77bc464fe9d2d0f1ba2d3ec1fe"
        fuseki_staging: true
        fuseki_shiro_url_rules: |
            /$/status  = authcBasic,user[admin]
        fuseki_shiro_users:   
        - name: "admin"
          password_stanza: "$shiro2$argon2id$v=19$t=1,m=65536,p=4$Wr/2XKxWeYZt8JE5HCONQw$yev4bLiGzbeIZ8qDWrIY7J2msL2vRO/aYksb4RMeX7Y"
        fuseki_workspace: "/tmp/"
     #   service_enhancer_url: "https://github.com/OyvindLGjesdal/jena/releases/download/service-enhancer-shaded/jena-serviceenhancer-5.2.0-SNAPSHOT.jar"
        #
        fuseki_modules:
                #
        # sis-embedded-data packaged with shading enabled
        - "https://github.com/OyvindLGjesdal/jena/releases/download/service-enhancer-shaded/jena-sis-nonfree-1.0.jar"
        - "https://github.com/OyvindLGjesdal/jena/releases/download/jena-6-se/jena-serviceenhancer-6.0.0.jar

                # - "https://repo1.maven.org/maven2/org/apache/sis/non-free/sis-embedded-data/1.4/sis-embedded-data-1.4.jar"
        fuseki_configurations:
        - name: "test-db_all"
          read_write: true
          write_timeout: "70000,200000"
          union_default_graph: true
          lucene: true
          geosparql: true

          service_enhancer: true
          luceneStoreValues: true
          prefix: |
            @prefix ex: <http://example.org/Schema#> .
          entity_map: |
            text:defaultField     "label" ;
            text:entityField      "uri" ;
            text:uidField         "uid" ;
            text:langField        "lang" ;
            text:graphField       "graph" ;
            text:map (
              [ text:field "label" ;

               text:predicate ex:name ] )
     
